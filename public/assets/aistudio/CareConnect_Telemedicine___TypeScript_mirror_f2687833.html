<style type="text/tailwindcss">@import "tailwindcss";



@custom-variant dark (&:is(.dark *));

@theme inline {
  --font-display: "Sora", ui-sans-serif, system-ui, sans-serif;
  --font-sans: "Manrope", ui-sans-serif, system-ui, sans-serif;
  --radius-sm: calc(var(--radius) - 4px);
  --radius-md: calc(var(--radius) - 2px);
  --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) + 4px);
  --radius-2xl: calc(var(--radius) + 8px);
  --radius-3xl: calc(var(--radius) + 12px);
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-card: var(--card);
  --color-card-foreground: var(--card-foreground);
  --color-popover: var(--popover);
  --color-popover-foreground: var(--popover-foreground);
  --color-primary: var(--primary);
  --color-primary-foreground: var(--primary-foreground);
  --color-primary-soft: var(--primary-soft);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted: var(--muted);
  --color-muted-foreground: var(--muted-foreground);
  --color-accent: var(--accent);
  --color-accent-foreground: var(--accent-foreground);
  --color-accent-soft: var(--accent-soft);
  --color-success: var(--success);
  --color-success-soft: var(--success-soft);
  --color-destructive: var(--destructive);
  --color-destructive-foreground: var(--destructive-foreground);
  --color-border: var(--border);
  --color-input: var(--input);
  --color-ring: var(--ring);
  --color-stage: var(--stage);
  --color-bezel: var(--bezel);
  --color-call: var(--call);
  --color-call-foreground: var(--call-foreground);
}

:root {
  --radius: 1rem;
  --stage: oklch(0.93 0.03 185);
  --bezel: oklch(0.18 0.02 220);
  --background: oklch(0.985 0.006 180);
  --foreground: oklch(0.22 0.03 225);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.22 0.03 225);
  --popover: oklch(1 0 0);
  --popover-foreground: oklch(0.22 0.03 225);
  --primary: oklch(0.48 0.1 192);
  --primary-foreground: oklch(0.99 0.005 180);
  --primary-soft: oklch(0.94 0.04 188);
  --secondary: oklch(0.955 0.012 200);
  --secondary-foreground: oklch(0.3 0.04 220);
  --muted: oklch(0.955 0.01 200);
  --muted-foreground: oklch(0.52 0.03 220);
  --accent: oklch(0.7 0.16 38);
  --accent-foreground: oklch(0.99 0 0);
  --accent-soft: oklch(0.95 0.04 45);
  --success: oklch(0.6 0.14 155);
  --success-soft: oklch(0.95 0.05 155);
  --destructive: oklch(0.6 0.21 25);
  --destructive-foreground: oklch(0.99 0 0);
  --border: oklch(0.91 0.015 200);
  --input: oklch(0.91 0.015 200);
  --ring: oklch(0.48 0.1 192);
  --call: oklch(0.2 0.03 220);
  --call-foreground: oklch(0.97 0.01 200);
  --gradient-primary: linear-gradient(140deg, oklch(0.52 0.11 192), oklch(0.38 0.08 215));
  --gradient-stage: radial-gradient(circle at 20% 10%, oklch(0.96 0.04 185), transparent 50%),
    radial-gradient(circle at 85% 90%, oklch(0.93 0.05 45), transparent 45%), var(--stage);
  --shadow-phone: 0 40px 80px -20px oklch(0.25 0.05 210 / 0.45), 0 0 0 2px oklch(0.35 0.02 220);
  --shadow-card: 0 8px 24px -14px oklch(0.3 0.05 210 / 0.35);
}

@layer base {
  * { border-color: var(--color-border); }
  body {
    background: var(--gradient-stage);
    color: var(--color-foreground);
    font-family: var(--font-sans);
  }
  h1, h2, h3 { font-family: var(--font-display); }
}

@utility bg-gradient-primary { background-image: var(--gradient-primary); }
@utility shadow-phone { box-shadow: var(--shadow-phone); }
@utility shadow-card { box-shadow: var(--shadow-card); }
@utility no-scrollbar {
  scrollbar-width: none;
  &::-webkit-scrollbar { display: none; }
}
@utility pulse-ring {
  animation: pulse-ring 1.8s ease-out infinite;
}
@keyframes pulse-ring {
  0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--primary) 60%, transparent); }
  100% { box-shadow: 0 0 0 28px transparent; }
}
</style>

<div id="root"></div><div id="err"></div>
<script id="files" type="application/json">{"src/components/tele/advanced.tsx": "import { useMemo, useState } from \"react\";\nimport { Activity, AlertTriangle, ArrowDownLeft, ArrowUpRight, CalendarDays, Check, HeartPulse, MapPin, Plus, ShieldAlert, TestTube2, Wallet as WalletIcon } from \"lucide-react\";\nimport { toast } from \"sonner\";\nimport { SPECIALTIES, formatKES, todayISO } from \"@/lib/tele/data\";\nimport { useTele, type Vital } from \"@/lib/tele/store\";\nimport { Btn, Card, Field, Header, inputCls } from \"./ui\";\n\nconst packages = [{ name: \"Full blood count\", price: 850 }, { name: \"Diabetes screen\", price: 1200 }, { name: \"Lipid profile\", price: 1500 }, { name: \"Thyroid panel\", price: 2200 }, { name: \"Liver function\", price: 1800 }, { name: \"Kidney function\", price: 1600 }, { name: \"Vitamin D\", price: 2500 }, { name: \"Pregnancy test\", price: 700 }];\nexport function Triage() {\n  const { go } = useTele();\n  const [symptoms, setSymptoms] = useState(\"\");\n  const [result, setResult] = useState(false);\n  const text = symptoms.toLowerCase();\n  const emergency = /chest pain|difficulty breathing|can't breathe|shortness of breath|unconscious|severe bleeding|stroke|seizure/.test(text);\n  const match = SPECIALTIES.find((s) => text.includes(s.name.toLowerCase())) ?? (/(heart|palpitation|chest)/.test(text) ? SPECIALTIES.find((s) => s.name === \"Cardiology\") : /(rash|itch|skin|acne)/.test(text) ? SPECIALTIES.find((s) => s.name === \"Dermatology\") : /(anxiety|stress|sleep|mood)/.test(text) ? SPECIALTIES.find((s) => s.name === \"Mental Health\") : /(child|baby|kid|infant)/.test(text) ? SPECIALTIES.find((s) => s.name === \"Pediatrics\") : SPECIALTIES.find((s) => s.name === \"General\"));\n  return <div className=\"pb-6\"><Header title=\"Symptom checker\" /><div className=\"space-y-4 px-5\">\n    <Card className=\"bg-primary-soft\"><div className=\"flex gap-3\"><HeartPulse className=\"h-6 w-6 shrink-0 text-primary\" /><div><p className=\"font-bold\">A helpful first step<\/p><p className=\"mt-1 text-xs text-muted-foreground\">This tool offers general guidance only. It cannot diagnose or replace a clinician.<\/p><\/div><\/div><\/Card>\n    <Field label=\"Tell us what you're experiencing\"><textarea value={symptoms} onChange={(e) => { setSymptoms(e.target.value); setResult(false); }} rows={5} className={inputCls + \" h-auto py-3\"} placeholder=\"Describe your symptoms, when they started, and how severe they feel\u2026\" /><\/Field>\n    <div className=\"flex flex-wrap gap-2\">{[\"Headache\", \"Fever\", \"Skin rash\", \"Chest pain\"].map((s) => <button key={s} onClick={() => { setSymptoms((x) => x ? `${x}, ${s.toLowerCase()}` : s); setResult(false); }} className=\"rounded-full bg-muted px-3 py-1.5 text-xs font-semibold\">+ {s}<\/button>)}<\/div>\n    <Btn className=\"w-full\" disabled={!symptoms.trim()} onClick={() => setResult(true)}>Review symptoms<\/Btn>\n    {result && <Card className={emergency ? \"border border-destructive bg-destructive/5\" : \"border border-primary/20\"}>\n      <div className=\"flex items-center gap-2 font-bold\">{emergency ? <ShieldAlert className=\"h-5 w-5 text-destructive\" /> : <Activity className=\"h-5 w-5 text-primary\" />}{emergency ? \"Seek urgent medical help now\" : \"Suggested next step\"}<\/div>\n      <p className=\"mt-2 text-sm text-muted-foreground\">{emergency ? \"These symptoms may be serious. Call your local emergency number (in Kenya, 999 or 112) or go to the nearest emergency department. Do not wait for an online appointment.\" : `Consider discussing this with a ${match?.name.toLowerCase()} clinician. A doctor will assess you and determine the right care.`}<\/p>\n      {!emergency && <Btn className=\"mt-4 w-full\" onClick={() => go({ name: \"doctors\", specialty: match?.name })}>Find a {match?.name} doctor<\/Btn>}\n    <\/Card>}\n  <\/div><\/div>;\n}\nconst vitalKinds: Vital[\"kind\"][] = [\"Blood pressure\", \"Glucose\", \"Temperature\", \"Weight\", \"Heart rate\"];\ntype BleCharacteristic = { readValue: () => Promise<DataView>; startNotifications?: () => Promise<BleCharacteristic>; addEventListener?: (name: string, cb: (event: { target?: { value?: DataView } }) => void) => void };\ntype BleDevice = { name?: string | null; gatt?: { connect: () => Promise<{ getPrimaryService: (id: string) => Promise<{ getCharacteristic: (id: string) => Promise<BleCharacteristic> }> }> } };\ntype BluetoothNavigator = Navigator & { bluetooth?: { requestDevice: (options: { filters?: { services: string[] }[]; optionalServices?: string[] }) => Promise<BleDevice> } };\nconst decodeSfloat = (v: DataView, offset: number) => {\n  const raw = v.getUint16(offset, true);\n  let mantissa = raw & 0x0fff;\n  if (mantissa & 0x0800) mantissa -= 0x1000;\n  let exponent = (raw >> 12) & 0x0f;\n  if (exponent & 0x08) exponent -= 0x10;\n  return mantissa * 10 ** exponent;\n};\nconst bleProfiles = [\n  { service: \"heart_rate\", characteristic: \"heart_rate_measurement\", kind: \"Heart rate\" as const, parse: (v: DataView) => `${v.getUint8(0) & 1 ? v.getUint16(1, true) : v.getUint8(1)} bpm` },\n  { service: \"health_thermometer\", characteristic: \"temperature_measurement\", kind: \"Temperature\" as const, parse: (v: DataView) => {\n    const raw = v.getUint32(1, true);\n    let mantissa = raw & 0x00ffffff;\n    if (mantissa & 0x00800000) mantissa -= 0x01000000;\n    let exponent = raw >>> 24;\n    if (exponent >= 0x80) exponent -= 0x100;\n    const measured = mantissa * 10 ** exponent;\n    const celsius = v.getUint8(0) & 1 ? (measured - 32) * 5 / 9 : measured;\n    return `${celsius.toFixed(1)} \u00b0C`;\n  } },\n  { service: \"blood_pressure\", characteristic: \"blood_pressure_measurement\", kind: \"Blood pressure\" as const, parse: (v: DataView) => {\n    const multiplier = v.getUint8(0) & 1 ? 7.50062 : 1;\n    return `${Math.round(decodeSfloat(v, 1) * multiplier)}/${Math.round(decodeSfloat(v, 3) * multiplier)} mmHg`;\n  } },\n];\nexport function Vitals() {\n  const { vitals, set } = useTele();\n  const [fields, setFields] = useState<Record<Vital[\"kind\"], string>>({ \"Blood pressure\": \"\", Glucose: \"\", Temperature: \"\", Weight: \"\", \"Heart rate\": \"\" });\n  const [note, setNote] = useState(\"\");\n  const [deviceName, setDeviceName] = useState(\"\");\n  const [deviceBusy, setDeviceBusy] = useState(false);\n  const latest = useMemo(() => vitalKinds.map((k) => [k, vitals.find((v) => v.kind === k)] as const), [vitals]);\n  const change = (kind: Vital[\"kind\"], value: string) => setFields((current) => ({ ...current, [kind]: value }));\n  const save = () => {\n    const readings = vitalKinds.filter((kind) => fields[kind].trim()).map((kind, index) => ({ id: `v${Date.now()}-${index}`, kind, value: fields[kind].trim(), date: new Date().toLocaleString(), note }));\n    if (!readings.length) return;\n    set((s) => ({ vitals: [...readings, ...s.vitals] }));\n    setFields({ \"Blood pressure\": \"\", Glucose: \"\", Temperature: \"\", Weight: \"\", \"Heart rate\": \"\" });\n    setNote(\"\");\n    toast.success(`${readings.length} vital${readings.length === 1 ? \"\" : \"s\"} saved together`);\n  };\n  const pair = async () => {\n    const bluetooth = (navigator as BluetoothNavigator).bluetooth;\n    if (!bluetooth) { toast.error(\"Bluetooth pairing requires a compatible browser and HTTPS. Try Chrome or Edge on a supported device.\"); return; }\n    setDeviceBusy(true);\n    try {\n      const device = await bluetooth.requestDevice({ filters: bleProfiles.map((profile) => ({ services: [profile.service] })) });\n      if (!device.gatt) throw new Error(\"This device does not expose a readable Bluetooth service.\");\n      const server = await device.gatt.connect();\n      setDeviceName(device.name || \"Bluetooth health device\");\n      let connected = 0;\n      for (const profile of bleProfiles) {\n        try {\n          const service = await server.getPrimaryService(profile.service);\n          const characteristic = await service.getCharacteristic(profile.characteristic);\n          const applyReading = (raw: DataView) => change(profile.kind, profile.parse(raw));\n          applyReading(await characteristic.readValue());\n          if (characteristic.startNotifications) {\n            const notifyCharacteristic = await characteristic.startNotifications();\n            notifyCharacteristic.addEventListener?.(\"characteristicvaluechanged\", (event) => { if (event.target?.value) applyReading(event.target.value); });\n          }\n          connected += 1;\n        } catch { /* A paired device may expose only some standard health services. */ }\n      }\n      if (connected) toast.success(`Connected to ${device.name || \"health device\"}; live values will fill the form. Save when ready.`);\n      else toast(\"Device paired, but no supported live measurement service was found.\");\n    } catch (error) {\n      const message = error instanceof Error ? error.message : \"Could not connect to device\";\n      if (!message.toLowerCase().includes(\"cancel\")) toast.error(message);\n    } finally { setDeviceBusy(false); }\n  };\n  const abnormal = (v: Vital) => { const n = parseFloat(v.value); return v.kind === \"Blood pressure\" ? n >= 140 || /\\/[9-9]/.test(v.value) : v.kind === \"Glucose\" ? n >= 200 || n < 70 : v.kind === \"Temperature\" ? n >= 38 : v.kind === \"Heart rate\" ? n > 100 || n < 50 : false; };\n  return <div className=\"pb-6\"><Header title=\"Vitals tracker\" /><div className=\"space-y-4 px-5\">\n    <div className=\"grid grid-cols-2 gap-2\">{latest.map(([k, v]) => <Card key={k} className=\"p-3\"><p className=\"text-[11px] text-muted-foreground\">{k}<\/p><p className=\"mt-1 font-bold\">{v?.value ?? \"\u2014\"}<\/p>{v && <p className=\"text-[10px] text-muted-foreground\">{v.date}<\/p>}<\/Card>)}<\/div>\n    <Card className=\"space-y-3\"><h2 className=\"font-bold\">Record today\u2019s vitals<\/h2><p className=\"text-xs text-muted-foreground\">Enter one or more measurements, then save them together.<\/p>\n      <Field label=\"Blood pressure (e.g. 120/80 mmHg)\"><input value={fields[\"Blood pressure\"]} onChange={(e) => change(\"Blood pressure\", e.target.value)} className={inputCls} placeholder=\"120/80\" /><\/Field>\n      <div className=\"grid grid-cols-2 gap-3\"><Field label=\"Glucose (mmol/L or mg/dL)\"><input value={fields.Glucose} onChange={(e) => change(\"Glucose\", e.target.value)} className={inputCls} placeholder=\"e.g. 5.4\" /><\/Field><Field label=\"Temperature (\u00b0C)\"><input type=\"number\" step=\"0.1\" value={fields.Temperature} onChange={(e) => change(\"Temperature\", e.target.value)} className={inputCls} placeholder=\"36.8\" /><\/Field><\/div>\n      <div className=\"grid grid-cols-2 gap-3\"><Field label=\"Weight (kg)\"><input type=\"number\" step=\"0.1\" value={fields.Weight} onChange={(e) => change(\"Weight\", e.target.value)} className={inputCls} placeholder=\"70.0\" /><\/Field><Field label=\"Heart rate (bpm)\"><input type=\"number\" value={fields[\"Heart rate\"]} onChange={(e) => change(\"Heart rate\", e.target.value)} className={inputCls} placeholder=\"72\" /><\/Field><\/div>\n      <Field label=\"Note (optional)\"><input value={note} onChange={(e) => setNote(e.target.value)} className={inputCls} placeholder=\"Context or how you feel\" /><\/Field>\n      <Btn className=\"w-full\" onClick={save} disabled={!vitalKinds.some((kind) => fields[kind].trim())}><Plus className=\"h-4 w-4\" />Save all entered vitals<\/Btn>\n    <\/Card>\n    <Card className=\"space-y-3 border border-primary/15\"><div className=\"flex items-center gap-2\"><Activity className=\"h-5 w-5 text-primary\" /><h2 className=\"font-bold\">Pair a health device<\/h2><\/div><p className=\"text-xs text-muted-foreground\">Connect compatible Bluetooth LE heart-rate monitors, thermometers, or blood-pressure monitors using standard GATT services. Live readings fill the form above; review and save them together.<\/p><Btn variant=\"soft\" className=\"w-full\" onClick={pair} disabled={deviceBusy}>{deviceBusy ? \"Waiting for device\u2026\" : deviceName ? `Connected \u00b7 ${deviceName}` : \"Pair Bluetooth device\"}<\/Btn><p className=\"text-[10px] text-muted-foreground\">Requires HTTPS and a browser/device with Web Bluetooth (typically Chrome or Edge). Device support varies; proprietary monitors need their manufacturer integration. Pairing does not send readings to a clinician automatically.<\/p><\/Card>\n    <h2 className=\"font-bold\">Measurement history<\/h2>{vitals.map((v) => <Card key={v.id} className=\"flex items-start gap-3 p-3\"><Activity className=\"mt-1 h-4 w-4 text-primary\" /><div className=\"min-w-0 flex-1\"><div className=\"flex justify-between gap-2\"><p className=\"text-sm font-bold\">{v.kind} \u00b7 {v.value}<\/p>{abnormal(v) && <AlertTriangle className=\"h-4 w-4 shrink-0 text-amber-600\" />}<\/div><p className=\"text-[11px] text-muted-foreground\">{v.date}{v.note ? ` \u00b7 ${v.note}` : \"\"}<\/p>{abnormal(v) && <p className=\"mt-1 text-xs text-amber-700\">Outside a common adult reference range. Contact a clinician for interpretation.<\/p>}<\/div><button aria-label=\"Delete measurement\" onClick={() => set((s) => ({ vitals: s.vitals.filter((x) => x.id !== v.id) }))} className=\"text-xs text-destructive\">Remove<\/button><\/Card>)}{!vitals.length && <p className=\"text-sm text-muted-foreground\">Your saved measurements will appear here.<\/p>}\n  <\/div><\/div>;\n}\nexport function Labs() {\n  const { labOrders, set, walletBalance, go } = useTele();\n  const [selected, setSelected] = useState(packages[0]!);\n  const [date, setDate] = useState(todayISO(1));\n  const [home, setHome] = useState(false);\n  const [address, setAddress] = useState(\"\");\n  const place = () => { const cost = selected.price + (home ? 300 : 0); if (walletBalance < cost) { toast.error(\"Not enough wallet balance. Top up to continue.\"); go({ name: \"wallet\" }); return; } const order = { id: `l${Date.now()}`, test: selected.name, date, homeCollection: home, address, status: \"Scheduled\" as const, price: cost }; set((s) => ({ labOrders: [order, ...s.labOrders], walletBalance: s.walletBalance - cost, walletEntries: [{ id: `w${Date.now()}`, label: `Lab test \u00b7 ${selected.name}`, amount: cost, date: todayISO(), kind: \"debit\" as const }, ...s.walletEntries] })); toast.success(\"Lab test booked\"); };\n  return <div className=\"pb-6\"><Header title=\"Lab tests\" /><div className=\"space-y-4 px-5\"><Card className=\"bg-primary-soft\"><p className=\"font-bold\">Book a test<\/p><p className=\"mt-1 text-xs text-muted-foreground\">Demo booking. Results and collection status are simulated.<\/p><\/Card>\n    <div className=\"space-y-2\">{packages.map((p) => <button key={p.name} onClick={() => setSelected(p)} className={`flex w-full items-center gap-3 rounded-2xl bg-card p-3 text-left shadow-card ${selected.name === p.name ? \"ring-2 ring-primary\" : \"\"}`}><TestTube2 className=\"h-5 w-5 text-primary\" /><span className=\"flex-1 text-sm font-semibold\">{p.name}<\/span><span className=\"text-xs font-bold\">{formatKES(p.price)}<\/span><\/button>)}<\/div>\n    <Field label=\"Appointment date\"><input type=\"date\" min={todayISO()} value={date} onChange={(e) => setDate(e.target.value)} className={inputCls} /><\/Field><label className=\"flex items-center gap-3 rounded-2xl bg-card p-4 text-sm\"><input type=\"checkbox\" checked={home} onChange={(e) => setHome(e.target.checked)} />Home sample collection (+KES 300)<\/label>{home && <Field label=\"Collection address\"><input value={address} onChange={(e) => setAddress(e.target.value)} className={inputCls} placeholder=\"Street, estate, town\" /><\/Field>}<Btn className=\"w-full\" onClick={place} disabled={!date || (home && !address.trim())}>Book \u00b7 {formatKES(selected.price + (home ? 300 : 0))}<\/Btn>\n    <h2 className=\"pt-2 font-bold\">Your orders<\/h2>{labOrders.map((o) => <Card key={o.id} className=\"space-y-1\"><div className=\"flex justify-between\"><p className=\"text-sm font-bold\">{o.test}<\/p><span className=\"rounded-full bg-primary-soft px-2 py-1 text-[10px] font-bold text-primary\">{o.status}<\/span><\/div><p className=\"text-xs text-muted-foreground\"><CalendarDays className=\"mr-1 inline h-3 w-3\" />{o.date} \u00b7 {o.homeCollection ? `Home collection \u00b7 ${o.address}` : \"Clinic collection\"}<\/p><p className=\"text-xs\">{formatKES(o.price)} \u00b7 paid from wallet<\/p><\/Card>)}{!labOrders.length && <p className=\"text-sm text-muted-foreground\">No lab orders yet.<\/p>}\n  <\/div><\/div>;\n}\nexport function Wallet() {\n  const { walletBalance, walletEntries, set } = useTele();\n  const [amount, setAmount] = useState(\"1000\");\n  const topup = () => { const n = Number(amount); if (!Number.isFinite(n) || n < 100) { toast.error(\"Enter at least KES 100\"); return; } set((s) => ({ walletBalance: s.walletBalance + n, walletEntries: [{ id: `w${Date.now()}`, label: \"M-Pesa top-up (demo)\", amount: n, date: todayISO(), kind: \"credit\" }, ...s.walletEntries] })); toast.success(\"Wallet topped up (demo)\"); };\n  return <div className=\"pb-6\"><Header title=\"Health wallet\" /><div className=\"space-y-4 px-5\"><Card className=\"bg-gradient-primary text-primary-foreground\"><div className=\"flex items-center gap-2 text-sm opacity-80\"><WalletIcon className=\"h-4 w-4\" />Available balance<\/div><p className=\"mt-2 font-display text-3xl font-bold\">{formatKES(walletBalance)}<\/p><p className=\"mt-2 text-xs opacity-80\">Demo balance \u00b7 no real payments processed<\/p><\/Card>\n    <Card className=\"space-y-3\"><h2 className=\"font-bold\">Top up with M-Pesa<\/h2><div className=\"grid grid-cols-3 gap-2\">{[500, 1000, 2000].map((n) => <button key={n} onClick={() => setAmount(String(n))} className={`rounded-xl bg-muted py-2 text-xs font-bold ${amount === String(n) ? \"ring-2 ring-primary\" : \"\"}`}>{formatKES(n)}<\/button>)}<\/div><Field label=\"Amount (KES)\"><input type=\"number\" min=\"100\" value={amount /Card>\n      )}\n\n      <section>\n        <h2 className=\"mb-3 font-bold\">Top doctors<\/h2>\n        <div className=\"space-y-3\">\n          {doctors.slice(0, 3).map((d) => <DoctorRow key={d.id} id={d.id} />)}\n        <\/div>\n      <\/section>\n\n      <div className=\"grid grid-cols-2 gap-3\">\n        <Card onClick={() => go({ name: \"records\" })}><FileText className=\"h-5 w-5 text-primary\" /><p className=\"mt-2 text-sm font-bold\">Health records<\/p><p className=\"text-xs text-muted-foreground\">Labs & files<\/p><\/Card>\n        <Card onClick={() => go({ name: \"chats\" })}><MessageCircle className=\"h-5 w-5 text-primary\" /><p className=\"mt-2 text-sm font-bold\">Messages<\/p><p className=\"text-xs text-muted-foreground\">Ask your doctor<\/p><\/Card>\n      <\/div>\n    <\/div>\n  );\n}\n\nfunction DoctorRow({ id }: { id: string }) {\n  const { doctors, go } = useTele();\n  const d = doctors.find((x) => x.id === id)!;\n  return (\n    <Card onClick={() => go({ name: \"doctor\", id })} className=\"flex items-center gap-3\">\n      <Avatar doctor={d} size={60} />\n      <div className=\"min-w-0 flex-1\">\n        <p className=\"flex items-center gap-1 truncate text-sm font-bold\">{d.name}<ShieldCheck className=\"h-3.5 w-3.5 shrink-0 text-success\" /><\/p>\n        <p className=\"text-xs text-muted-foreground\">{d.specialty} \u00b7 {d.years} yrs<\/p>\n        <div className=\"mt-1 flex items-center gap-2\"><Stars value={d.rating} size={12} /><span className=\"text-[11px] text-muted-foreground\">{d.rating.toFixed(1)}<\/span><\/div>\n      <\/div>\n      <span className=\"text-xs font-bold text-primary\">{formatKES(d.fee)}<\/span>\n    <\/Card>\n  );\n}\n\nexport function Doctors({ specialty }: { specialty?: string | undefined }) {\n  const { doctors } = useTele();\n  const [filter, setFilter] = useState(SPECIALTIES.some((s) => s.name === specialty) ? specialty! : \"All\");\n  const [q, setQ] = useState(SPECIALTIES.some((s) => s.name === specialty) ? \"\" : specialty ?? \"\");\n  const list = doctors.filter((d) => (filter === \"All\" || d.specialty === filter) && (d.name + d.specialty + d.bio).toLowerCase().includes(q.toLowerCase()));\n  return (\n    <div className=\"pb-6\">\n      <Header title=\"Find a doctor\" />\n      <div className=\"px-5\">\n        <div className=\"flex items-center gap-2 rounded-2xl bg-card px-4 shadow-card\">\n          <Search className=\"h-4 w-4 text-muted-foreground\" />\n          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder=\"e.g. rash, chest pain, child fever\" className=\"h-12 flex-1 bg-transparent text-sm outline-none\" />\n        <\/div>\n      <\/div>\n      <div className=\"no-scrollbar mt-4 flex gap-2 overflow-x-auto px-5\">\n        {[\"All\", ...SPECIALTIES.map((s) => s.name)].map((s) => (\n          <button key={s} onClick={() => setFilter(s)} className={cn(\"shrink-0 rounded-full px-4 py-2 text-xs font-bold\", filter === s ? \"bg-primary text-primary-foreground\" : \"bg-card text-muted-foreground shadow-card\")}>{s}<\/button>\n        ))}\n      <\/div>\n      <div className=\"mt-4 space-y-3 px-5\">\n        {list.map((d) => <DoctorRow key={d.id} id={d.id} />)}\n        {!list.length && <p className=\"py-10 text-center text-sm text-muted-foreground\">No doctors match your search.<\/p>}\n      <\/div>\n    <\/div>\n  );\n}\n\nexport function DoctorProfile({ id }: { id: string }) {\n  const { doctors, go } = useTele();\n  const d = doctors.find((x) => x.id === id)!;\n  return (\n    <div className=\"flex min-h-full flex-col\">\n      <Header title=\"Doctor\" />\n      <div className=\"flex-1 space-y-5 px-5 pb-28\">\n        <div className=\"flex flex-col items-center text-center\">\n          <Avatar doctor={d} size={120} />\n          <h2 className=\"mt-4 flex items-center gap-1 text-xl font-bold\">{d.name}<ShieldCheck className=\"h-5 w-5 text-success\" /><\/h2>\n          <p className=\"text-sm text-muted-foreground\">{d.specialty}<\/p>\n          <span className=\"mt-2 rounded-full bg-success-soft px-3 py-1 text-[11px] font-bold text-success\">Licensed \u00b7 {d.license}<\/span>\n        <\/div>\n        <div className=\"grid grid-cols-3 gap-3 text-center\">\n          {[[\"Experience\", `${d.years} yrs`], [\"Rating\", d.rating.toFixed(1)], [\"Reviews\", String(d.reviews.length)]].map(([k, v]) => (\n            <div key={k} className=\"rounded-2xl bg-card p-3 shadow-card\"><p className=\"font-display text-lg font-bold text-primary\">{v}<\/p><p className=\"text-[11px] text-muted-foreground\">{k}<\/p><\/div>\n          ))}\n        <\/div>\n        <div><h3 className=\"mb-1 font-bold\">About<\/h3><p className=\"text-sm text-muted-foreground\">{d.bio}<\/p><p className=\"mt-2 text-xs text-muted-foreground\">Speaks: {d.languages.join(\", \")}<\/p><\/div>\n        <div>\n          <h3 className=\"mb-2 font-bold\">Reviews<\/h3>\n          <div className=\"space-y-2\">\n            {d.reviews.length ? d.reviews.map((r, i) => (\n              <Card key={i} className=\"p-3\"><div className=\"flex items-center justify-between\"><p className=\"text-sm font-bold\">{r.author}<\/p><Stars value={r.rating} size={12} /><\/div><p className=\"mt-1 text-xs text-muted-foreground\">{r.text}<\/p><\/Card>\n            )) : <p className=\"text-xs text-muted-foreground\">No reviews yet.<\/p>}\n          <\/div>\n        <\/div>\n      <\/div>\n      <div className=\"sticky bottom-0 flex items-center gap-3 border-t bg-background/95 px-5 py-4 backdrop-blur\">\n        <div><p className=\"text-[11px] text-muted-foreground\">Consultation<\/p><p className=\"font-display font-bold\">{formatKES(d.fee)}<\/p><\/div>\n        <Btn variant=\"soft\" className=\"w-12 px-0\" onClick={() => go({ name: \"chat\", doctorId: d.id })} aria-label=\"Message\"><MessageCircle className=\"h-5 w-5\" /><\/Btn>\n        <Btn className=\"flex-1\" onClick={() => go({ name: \"book\", id: d.id })}>Book appointment<\/Btn>\n      <\/div>\n    <\/div>\n  );\n}\n\nexport function Book({ id, prefill }: { id: string; prefill?: string | undefined }) {\n  const { doctors, patientName, appointments, availability, myDoctorId, acceptingPatients, go } = useTele();\n  const d = doctors.find((x) => x.id === id)!;\n  const days = useMemo(() => Array.from({ length: 7 }, (_, i) => todayISO(i)), []);\n  const [date, setDate] = useState<string>(days[0]!);\n  const [time, setTime] = useState(\"\");\n  const [type, setType] = useState<CallType>(\"video\");\n  const [reason, setReason] = useState(prefill ?? \"\");\n  const taken = appointments.filter((a) => a.doctorId === id && a.date === date).map((a) => a.time);\n  const bookable = !(id === myDoctorId && !acceptingPatients);\n  const now = new Date().toTimeString().slice(0, 5);\n  return (\n    <div className=\"flex min-h-full flex-col\">\n      <Header title=\"Book appointment\" />\n      <div className=\"flex-1 space-y-5 px-5 pb-28\">\n        <Card className=\"flex items-center gap-3\"><Avatar doctor={d} size={48} /><div><p className=\"text-sm font-bold\">{d.name}<\/p><p className=\"text-xs text-muted-foreground\">{d.specialty}<\/p><\/div><\/Card>\n        <div>\n          <h3 className=\"mb-2 text-sm font-bold\">Date<\/h3>\n          <div className=\"no-scrollbar flex gap-2 overflow-x-auto\">\n            {days.map((iso) => {\n              const dt = new Date(iso);\n              return (\n                <button key={iso} onClick={() => { setDate(iso); setTime(\"\"); }} className={cn(\"flex w-14 shrink-0 flex-col items-center rounded-2xl py-3\", date === iso ? \"bg-primary text-primary-foreground\" : \"bg-card shadow-card\")}>\n                  <span className=\"text-[10px] uppercase opacity-70\">{dt.toLocaleDateString(\"en\", { weekday: \"short\" })}<\/span>\n                  <span className=\"font-display text-lg font-bold\">{dt.getDate()}<\/span>\n                <\/button>\n              );\n            })}\n          <\/div>\n        <\/div>\n        <div>\n          <h3 className=\"mb-2 text-sm font-bold\">Time<\/h3>\n          <div className=\"grid grid-cols-4 gap-2\">\n            {TIME_SLOTS.map((t) => {\n              const weekday = new Date(`${date}T12:00:00`).toLocaleDateString(\"en-US\", { weekday: \"long\" });\n              const schedule = availability[`${id}:${weekday}`] ?? (id === myDoctorId ? TIME_SLOTS.slice(0, 6) : TIME_SLOTS);\n              const off = taken.includes(t) || (date === days[0] && t < now) || !schedule.includes(t);\n              return <button key={t} disabled={off} onClick={() => setTime(t)} className={cn(\"rounded-xl py-2.5 text-xs font-bold\", time === t ? \"bg-primary text-primary-foreground\" : \"bg-card shadow-card\", off && \"line-through opacity-40\")}>{t}<\/button>;\n            })}\n          <\/div>\n        <\/div>\n        <div>\n          <h3 className=\"mb-2 text-sm font-bold\">Consultation type<\/h3>\n          <div className=\"grid grid-cols-2 gap-3\">\n            {([[\"video\", Video, \"Video call\"], [\"voice\", Phone, \"Voice call\"]] as const).map(([k, I, l]) => (\n              <button key={k} onClick={() => setType(k)} className={cn(\"flex items-center gap-2 rounded-2xl p-4 text-sm font-bold\", type === k ? \"bg-primary-soft text-primary ring-2 ring-primary\" : \"bg-card shadow-card\")}><I className=\"h-5 w-5\" />{l}<\/button>\n            ))}\n          <\/div>\n        <\/div>\n        <Field label=\"What's bothering you?\"><textarea value={reason} onChange={(e) => setReason(e.target.value)} rows={3} placeholder=\"Describe your symptoms\" className={cn(inputCls, \"h-auto py-3\")} /><\/Field>\n        {!bookable && <Card className=\"border border-amber-500/20 bg-amber-500/5\"><p className=\"text-sm font-bold\">Bookings paused<\/p><p className=\"mt-1 text-xs text-muted-foreground\">This practice isn't accepting new bookings right now. Check back later or send a message instead.<\/p><\/Card>}\n      <\/div>\n      <div className=\"sticky bottom-0 border-t bg-background/95 px-5 py-4 backdrop-blur\">\n        <Btn className=\"w-full\" disabled={!time || !reason.trim() || !bookable} onClick={() => go({ name: \"pay\", appointment: { id: `a${Date.now()}`, doctorId: id, patient: patientName, date, time, type, reason, status: \"upcoming\", paid: false } })}>\n          Continue to payment \u00b7 {formatKES(d.fee)}\n        <\/Btn>\n      <\/div>\n    <\/div>\n  );\n}\n\nexport function Pay({ appointment }: { appointment: Appointment }) {\n  const { doctors, set, go, walletBalance } = useTele();\n  const d = doctors.find((x) => x.id === appointment.doctorId)!;\n  const [method, setMethod] = useState<\"mpesa\" | \"card\" | \"wallet\">(\"mpesa\");\n  const [phone, setPhone] = useState(\"0712 345 678\");\n  const [busy, setBusy] = useState(false);\n  const [done, setDone] = useState(false);\n  const pay = () => {\n    const total = d.fee + 50;\n    if (method === \"wallet\" && walletBalance < total) { toast.error(\"Insufficient wallet balance. Please top up first.\"); return; }\n    setBusy(true);\n    setTimeout(() => {\n      set((s) => ({ appointments: [...s.appointments, { ...appointment, paid: true }], ...(method === \"wallet\" ? { walletBalance: s.walletBalance - total, walletEntries: [{ id: `w${Date.now()}`, label: `Consultation \u00b7 ${d.name}`, amount: total, date: todayISO(), kind: \"debit\" as const }, ...s.walletEntries] } : {}) }));\n      setBusy(false); setDone(true);\n    }, 1600);\n  };\n  if (done) return (\n    <div className=\"flex h-full flex-col items-center justify-center px-8 text-center\">\n      <div className=\"grid h-24 w-24 place-items-center rounded-full bg-success-soft text-success\"><Check className=\"h-12 w-12\" /><\/div>\n      <h2 className=\"mt-6 text-2xl font-bold\">You're booked!<\/h2>\n      <p className=\"mt-2 text-sm text-muted-foreground\">{d.name} will call you by {appointment.type} on {appointment.date} at {appointment.time}. We'll remind you 10 minutes before.<\/p>\n      <Btn className=\"mt-8 w-full\" onClick={() => go({ name: \"appointments\" })}>View appointments<\/Btn>\n    <\/div>\n  );\n  return (\n    <div className=\"flex min-h-full flex-col\">\n      <Header title=\"Payment\" />\n      <div className=\"flex-1 space-y-4 px-5\">\n        <Card>\n          <div className=\"flex justify-between text-sm\"><span className=\"text-muted-foreground\">Consultation<\/span><span>{formatKES(d.fee)}<\/span><\/div>\n          <div className=\"mt-2 flex justify-between text-sm\"><span className=\"text-muted-foreground\">Service fee<\/span><span>{formatKES(50)}<\/span><\/div>\n          <div className=\"mt-3 flex justify-between border-t pt-3 font-bold\"><span>Total<\/span><span>{formatKES(d.fee + 50)}<\/span><\/div>\n        <\/Card>\n        {([[\"mpesa\", Smartphone, \"M-Pesa\", \"Pay via STK push\"], [\"card\", CreditCard, \"Card\", \"Visa / Mastercard\"], [\"wallet\", WalletIcon, \"Health wallet\", `Balance ${formatKES(walletBalance)}`]] as const).map(([k, I, l, s]) => (\n          <button key={k} onClick={() => setMethod(k)} className={cn(\"flex w-full items-center gap-3 rounded-2xl bg-card p-4 text-left shadow-card\", method === k && \"ring-2 ring-primary\")}>\n            <span className=\"grid h-10 w-10 place-items-center rounded-xl bg-primary-soft text-primary\"><I className=\"h-5 w-5\" /><\/span>\n            <div className=\"flex-1\"><p className=\"text-sm font-bold\">{l}<\/p><p className=\"text-xs text-muted-foreground\">{s}<\/p><\/div>\n            <span className={cn(\"h-5 w-5 rounded-full border-2\", method === k ? \"border-[6px] border-primary\" : \"border-border\")} />\n          <\/button>\n        ))}\n        {method === \"mpesa\" ? (\n          <Field label=\"M-Pesa phone number\"><input value={phone} onChange={(e) => setPhone(e.target.value)} className={inputCls} /><\/Field>\n        ) : method === \"card\" ? (\n          <div className=\"space-y-3\"><input placeholder=\"Card number\" defaultValue=\"4242 4242 4242 4242\" className={inputCls} /><div className=\"grid grid-cols-2 gap-3\"><input placeholder=\"MM/YY\" defaultValue=\"12/28\" className={inputCls} /><input placeholder=\"CVC\" defaultValue=\"123\" className={inputCls} /><\/div><\/div>\n        ) : <p className=\"rounded-2xl bg-primary-soft p-3 text-sm font-semibold text-primary\">Wallet balance: {formatKES(walletBalance)}{walletBalance < d.fee + 50 ? \" \u00b7 Top up before paying\" : \"\"}<\/p>}\n        <p className=\"text-center text-[11px] text-muted-foreground\">Demo mode \u2014 no real money is charged.<\/p>\n      <\/div>\n      <div className=\"p-5\"><Btn className=\"w-full\" disabled={busy} onClick={pay}>{busy ? \"Processing\u2026\" : `Pay ${formatKES(d.fee + 50)}`}<\/Btn><\/div>\n    <\/div>\n  );\n}\n\nexport function Appointments() {\n  const { appointments, doctors, prescriptions, set, go } = useTele();\n  const [tab, setTab] = useState<\"upcoming\" | \"completed\">(\"upcoming\");\n  const list = appointments.filter((a) => a.status === tab).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) * (tab === \"upcoming\" ? 1 : -1));\n  return (\n    <div className=\"space-y-4 px-5 pb-6 pt-2\">\n      <h1 className=\"text-xl font-bold\">Appointments<\/h1>\n      <div className=\"grid grid-cols-2 rounded-2xl bg-muted p-1\">\n        {([\"upcoming\", \"completed\"] as const).map((t) => <button key={t} onClick={() => setTab(t)} className={cn(\"rounded-xl py-2 text-sm font-bold capitalize\", tab === t ? \"bg-card shadow-card\" : \"text-muted-foreground\")}>{t}<\/button>)}\n      <\/div>\n      {list.map((a) => {\n        const d = doctors.find((x) => x.id === a.doctorId)!;\n        const rx = prescriptions.find((p) => p.appointmentId === a.id);\n        return (\n          <Card key={a.id} className=\"space-y-3\">\n            <div className=\"flex items-center gap-3\">\n              <Avatar doctor={d} size={48} />\n              <div className=\"flex-1\"><p className=\"text-sm font-bold\">{d.name}<\/p><p className=\"text-xs text-muted-foreground\">{d.specialty}<\/p><\/div>\n              <span className=\"flex items-center gap-1 rounded-full bg-primary-soft px-2.5 py-1 text-[11px] font-bold capitalize text-primary\">{a.type === \"video\" ? <Video className=\"h-3 w-3\" /> : <Phone className=\"h-3 w-3\" />}{a.type}<\/span>\n            <\/div>\n            <p className=\"flex items-center gap-2 text-xs text-muted-foreground\"><CalendarDays className=\"h-3.5 w-3.5\" />{a.date === todayISO() ? \"Today\" : a.date} \u00b7 {a.time}<\/p>\n            <p className=\"text-xs\">{a.reason}<\/p>\n            {tab === \"upcoming\" ? (\n              <div className=\"grid grid-cols-2 gap-2\">\n                <Btn variant=\"soft\" className=\"h-10\" onClick={() => go({ name: \"chat\", doctorId: d.id })}>Message<\/Btn>\n                <Btn className=\"h-10\" onClick={() => go({ name: \"call\", appointmentId: a.id })}>Join call<\/Btn>\n                <Btn variant=\"outline\" className=\"h-9 text-xs\" onClick={() => { set((s) => ({ appointments: s.appointments.map((x) => x.id === a.id ? { ...x, status: \"cancelled\" } : x), ...(a.paid ? { walletBalance: s.walletBalance + d.fee + 50, walletEntries: [{ id: `w${Date.now()}`, label: `Refund \u00b7 ${d.name}`, amount: d.fee + 50, date: todayISO(), kind: \"credit\" as const }, ...s.walletEntries] } : {}) })); toast.success(a.paid ? \"Appointment cancelled; refund added to wallet\" : \"Appointment cancelled\"); }}>Cancel \u00b7 refund<\/Btn>\n                <Btn variant=\"soft\" className=\"h-9 text-xs\" onClick={() => { set((s) => ({ appointments: s.appointments.map((x) => x.id === a.id ? { ...x, status: \"cancelled\" } : x), ...(a.paid ? { walletBalance: s.walletBalance + d.fee + 50, walletEntries: [{ id: `w${Date.now()}`, label: `Reschedule refund \u00b7 ${d.name}`, amount: d.fee + 50, date: todayISO(), kind: \"credit\" as const }, ...s.walletEntries] } : {}) })); go({ name: \"book\", id: d.id, prefill: a.reason }); }}>Reschedule<\/Btn>\n              <\/div>\n            ) : (\n              <div className=\"grid grid-cols-2 gap-2\">\n                <Btn variant=\"soft\" className=\"h-10\" onClick={() => go(rx ? { name: \"meds\" } : { name: \"chat\", doctorId: d.id })}>{rx ? \"Prescription\" : \"Message\"}<\/Btn>\n                {a.rated ? <Btn variant=\"outline\" className=\"h-10\" onClick={() => go({ name: \"book\", id: d.id })}>Book again<\/Btn> : <Btn variant=\"accent\" className=\"h-10\" onClick={() => go({ name: \"rate\", appointmentId: a.id })}>Rate visit<\/Btn>}\n              <\/div>\n            )}\n          <\/Card>\n        );\n      })}\n      {!list.length && <p className=\"py-10 text-center text-sm text-muted-foreground\">Nothing here yet.<\/p>}\n    <\/div>\n  );\n}\n\nexport function Rate({ appointmentId }: { appointmentId: string }) {\n  const { appointments, doctors, patientName, set, go } = useTele();\n  const a = appointments.find((x) => x.id === appointmentId)!;\n  const d = doctors.find((x) => x.id === a.doctorId)!;\n  const [rating, setRating] = useState(5);\n  const [text, setText] = useState(\"\");\n  return (\n    <div className=\"flex min-h-full flex-col\">\n      <Header title=\"Rate your visit\" onBack={() => go({ name: \"appointments\" })} />\n      <div className=\"flex flex-1 flex-col items-center px-6 text-center\">\n        <Avatar doctor={d} size={96} />\n        <h2 className=\"mt-4 text-lg font-bold\">How was {d.name}?<\/h2>\n        <div className=\"mt-4\"><Stars value={rating} onChange={setRating} size={36} /><\/div>\n        <textarea value={text} onChange={(e) => setText(e.target.value)} rows={4} placeholder=\"Share your experience (optional)\" className={cn(inputCls, \"mt-6 h-auto py-3\")} />\n      <\/div>\n      <div className=\"p-5\">\n        <Btn className=\"w-full\" onClick={() => {\n          set((s) => ({\n            appointments: s.appointments.map((x) => (x.id === a.id ? { ...x, rated: true } : x)),\n            doctors: s.doctors.map((x) => x.id === d.id ? { ...x, reviews: [{ author: d === id).at(-1)!;\n        return (\n          <Card key={id} onClick={() => go({ name: \"chat\", doctorId: id })} className=\"flex items-center gap-3\">\n            <Avatar doctor={d} size={48} />\n            <div className=\"min-w-0 flex-1\"><p className=\"text-sm font-bold\">{d.name}<\/p><p className=\"truncate text-xs text-muted-foreground\">{last.text}<\/p><\/div>\n            <span className=\"text-[10px] text-muted-foreground\">{last.at}<\/span>\n          <\/Card>\n        );\n      })}\n      {!ids.length && <p className=\"py-10 text-center text-sm text-muted-foreground\">Open a doctor's profile to start a conversation.<\/p>}\n    <\/div>\n  );\n}\n\nexport function Chat({ doctorId }: { doctorId: string }) {\n  const { doctors, messages, set } = useTele();\n  const d = doctors.find((x) => x.id === doctorId)!;\n  const [text, setText] = useState(\"\");\n  const endRef = useRef<HTMLDivElement>(null);\n  const thread = messages.filter((m) => m.doctorId === doctorId);\n  const send = () => {\n    if (!text.trim()) return;\n    const at = new Date().toTimeString().slice(0, 5);\n    set((s) => ({ messages: [...s.messages, { id: `m${Date.now()}`, doctorId, patient: patientName, from: \"patient\", text, at }] }));\n    setText(\"\");\n    setTimeout(() => {\n      set((s) => ({ messages: [...s.messages, { id: `m${Date.now()}`, doctorId, patient: patientName, from: \"doctor\", text: \"Thanks for the update. I'll review this and we can discuss more during our consultation.\", at: new Date().toTimeString().slice(0, 5) }] }));\n      endRef.current?.scrollIntoView({ behavior: \"smooth\" });\n    }, 1500);\n  };\n  return (\n    <div className=\"flex h-full flex-col\">\n      <Header title={d.name} right={<Avatar doctor={d} size={36} />} />\n      <div className=\"flex-1 space-y-2 overflow-y-auto px-5 py-2\">\n        {thread.map((m) => (\n          <div key={m.id} className={cn(\"max-w-[80%] rounded-2xl px-4 py-2.5 text-sm\", m.from === \"patient\" ? \"ml-auto round className=\"flex items-center gap-1 truncate text-sm font-bold\">{me.name}<ShieldCheck className=\"h-4 w-4 shrink-0 text-success\" /><\/p>\n        <\/div>\n        <button onClick={() => go({ name: \"doc-settings\" })} aria-label=\"Practice settings\" className=\"grid h-10 w-10 shrink-0 place-items-center rounded-full bg-card shadow-card\"><Settings className=\"h-4 w-4\" /><\/button>\n      <\/div>\n\n      {next ? (\n        <div className=\"rounded-3xl bg-gradient-primary p-5 text-primary-foreground shadow-card\">\n          <p className=\"text-xs font-semibold uppercase tracking-wider opacity-80\">Next consultation<\/p>\n          <div className=\"mt-3 flex items-center gap-3\">\n            <Avatar doctor={{ name: next.patient }} size={48} />\n            <div className=\"min-w-0 flex-1\">\n              <p className=\"truncate font-bold\">{next.patient}<\/p>\n              <p className=\"text-xs opacity-80\">{next.date === today ? \"Today\" : next.date} \u00b7 {next.time} \u00b7 {next.type}<\/p>\n            <\/div>\n            {next.type === \"video\" ? <Video className=\"h-5 w-5 shrink-0\" /> : <Phone className=\"h-5 w-5 shrink-0\" />}\n          <\/div>\n          <div className=\"mt-4 grid grid-cols-2 gap-2\">\n            <button onClick={() => go({ name: \"doc-patient\", patient: next.patient })} className=\"rounded-2xl bg-primary-foreground/15 py-2.5 text-xs font-bold\">View chart<\/button>\n            <button onClick={() => go({ name: \"call\", appointmentId: next.id })} className=\"rounded-2xl bg-accent py-2.5 text-xs font-bold text-accent-foreground\">Start {next.type} call<\/button>\n          <\/div>\n        <\/div>\n      ) : (\n        <div className=\"rounded-3xl bg-gradient-primary p-5 text-primary-foreground shadow-card\">\n          <p className=\"text-sm font-bold\">No consultations scheduled<\/p>\n          <p className=\"mt-1 text-xs opacity-80\">{acceptingPatients ? \"Open more slots so patients can book you.\" : \"You're not accepting new bookings right now.\"}<\/p>\n          <button onClick={() => go({ name: \"doc-schedule\" })} className=\"mt-4 rounded-2xl bg-primary-foreground/15 px-4 py-2 text-xs font-bold\">Set availability<\/button>\n        <\/div>\n      )}\n\n      <div className=\"grid grid-cols-4 gap-2 text-center\">\n        {stats.map(([k, v]) => (\n          <div key={k} className=\"rounded-2xl bg-card p-3 shadow-card\"><p className=\"font-display text-lg font-bold text-primary\">{v}<\/p><p className=\"text-[10px] text-muted-foreground\">{k}<\/p><\/div>\n        ))}\n      <\/div>\n\n      <section className=\"grid grid-cols-2 gap-3\">\n        {quickActions.map(([label, I, screen, badge]) => (\n          <button key={label} onClick={() => go({ name: screen })} className=\"flex items-center gap-3 rounded-2xl bg-card p-3 text-left shadow-card\">\n            <span className=\"relative grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-primary-soft text-primary\">\n              <I className=\"h-5 w-5\" />\n              {badge && <span className=\"absolute -right-1 -top-1 grid h-4 min-w-4 place-items-center rounded-full bg-accent px-1 text-[9px] font-bold text-accent-foreground\">{badge}<\/span>}\n            <\/span>\n            <span className=\"text-xs font-bold\">{label}<\/span>\n          <\/button>\n        ))}\n      <\/section>\n\n      {todaysList.length > 0 && (\n        <section>\n          <h2 className=\"mb-3 font-bold\">Today's schedule<\/h2>\n          <div className=\"space-y-3\">\n            {todaysList.map((a) => (\n              <Card key={a.id} className=\"flex items-center gap-3\">\n                <div className=\"w-14 shrink-0 text-center\"><p className=\"font-display text-sm font-bold text-primary\">{a.time}<\/p><p className=\"text-[10px] capitalize text-muted-foreground\">{a.type}<\/p><\/div>\n                <div className=\"min-w-0 flex-1 border-l border-border pl-3\"><p className=\"truncate text-sm font-bold\">{a.patient}<\/p><p className=\"truncate text-xs text-muted-foreground\">{a.reason}<\/p><\/div>\n                <Btn className=\"h-9 w-9 shrink-0 px-0\" onClick={() => go({ name: \"call\", appointmentId: a.id })} aria-label={`Call ${a.patient}`}>{a.type === \"video\" ? <Video className=\"h-4 w-4\" /> : <Phone className=\"h-4 w-4\" />}<\/Btn>\n              <\/Card>\n            ))}\n          <\/div>\n        <\/section>\n      )}\n\n      {needsRx.length > 0 && (\n        <section>\n          <h2 className=\"mb-3 font-bold\">Needs your attention<\/h2>\n          <div className=\"space-y-3\">\n            {needsRx.map((a) => (\n              <Card key={a.id} className=\"flex items-center gap-3 border border-accent/30 bg-accent-soft\">\n                <span className=\"grid h-10 w-10 shrink-0 place-items-center rounded-2xl bg-accent text-accent-foreground\"><FileText className=\"h-5 w-5\" /><\/span>\n                <div className=\"min-w-0 flex-1\"><p className=\"text-sm font-bold\">Prescription pending<\/p><p className=\"truncate text-xs text-muted-foreground\">{a.patient} \u00b7 {a.date}<\/p><\/div>\n                <Btn variant=\"accent\" className=\"h-9 shrink-0 px-3 text-xs\" onClick={() => go({ name: \"doc-prescribe\", appointmentId: a.id })}>Prescribe<\/Btn>\n              <\/Card>\n            ))}\n          <\/div>\n        <\/section>\n      )}\n\n      {!!done.length && (\n        <section>\n          <h2 className=\"mb-3 font-bold\">Recent visits<\/h2>\n          <div className=\"space-y-3\">\n            {done.slice(0, 4).map((a) => {\n              const rx = prescriptions.some((p) => p.appointmentId === a.id);\n              return (\n                <Card key={a.id} className=\"flex items-center gap-3\">\n                  <Avatar doctor={{ name: a.patient }} size={40} />\n                  <div className=\"min-w-0 flex-1\"><p className=\"truncate text-sm font-bold\">{a.patient}<\/p><p className=\"text-xs text-muted-foreground\">{a.date}<\/p><\/div>\n                  <div className=\"flex shrink-0 gap-2\">\n                    <Btn variant=\"soft\" className=\"h-9 px-3 text-xs\" onClick={() => go({ name: \"doc-patient\", patient: a.patient })}>Chart<\/Btn>\n                    <Btn variant={rx ? \"outline\" : \"soft\"} className=\"h-9 px-3 text-xs\" disabled={rx} onClick={() => go({ name: \"doc-prescribe\", appointmentId: a.id })}>{rx ? \"Prescribed\" : \"Prescribe\"}<\/Btn>\n                  <\/div>\n                <\/Card>\n              );\n            })}\n          <\/div>\n        <\/section>\n      )}\n\n      {!mine.length && <p className=\"py-10 text-center text-sm text-muted-foreground\">No consultations yet \u2014 patients will appear here after booking.<\/p>}\n    <\/div>\n  );\n}\n\nexport function Prescribe({ appointmentId, fromChat }: { appointmentId: string; fromChat?: boolean | undefined }) {\n  const { appointments, prescriptions, patientProfiles, set, go, back } = useTele();\n  const a = appointments.find((x) => x.id === appointmentId)!;\n  const blank = (): Medication => ({ id: `m${Math.random()}`, name: \"\", dose: \"1 tablet\", frequency: 2, days: 5, notes: \"\", times: defaultTimes(2), reminders: true, taken: [] });\n  const [diagnosis, setDiagnosis] = useState(\"\");\n  const [clinicalNotes, setClinicalNotes] = useState(\"\");\n  const [selectedDiagnosis, setSelectedDiagnosis] = useState<{ code: string; title: string } | null>(null);\n  const [diagnosisOptions, setDiagnosisOptions] = useState<{ code: string; title: string }[]>([]);\n  const [searchingDiagnosis, setSearchingDiagnosis] = useState(false);\n  const [showOptions, setShowOptions] = useState(false);\n  const [offlineList, setOfflineList] = useState(false);\n  const [medFocus, setMedFocus] = useState<number | null>(null);\n  useEffect(() => {\n    if (diagnosis.trim().length < 2 || selectedDiagnosis?.title === diagnosis) { setDiagnosisOptions([]); return; }\n    let active = true;\n    const timer = setTimeout(async () => {\n      setSearchingDiagnosis(true);\n      try {\n        const url = new URL(\"https://clinicaltables.nlm.nih.gov/api/icd11_codes/v3/search\");\n        url.searchParams.set(\"terms\", diagnosis.trim());\n        url.searchParams.set(\"sf\", \"title\");\n        url.searchParams.set(\"df\", \"code,title\");\n        url.searchParams.set(\"type\", \"stem\");\n        url.searchParams.set(\"count\", \"8\");\n        const response = await fetch(url);\n        if (!response.ok) throw new Error(\"ICD-11 lookup is unavailable\");\n        const payload = await response.json() as [number, string[], unknown, [string, string][]];\n        const live = (payload[3] ?? []).map(([code, title]) => ({ code, title }));\n        if (active) { setDiagnosisOptions(live.length ? live : searchLocalDiagnoses(diagnosis)); setOfflineList(!live.length); }\n      } catch {\n        // The live lookup can be blocked or offline: fall back to the built-in list so the doctor still gets suggestions.\n        if (active) { setDiagnosisOptions(searchLocalDiagnoses(diagnosis)); setOfflineList(true); }\n      } finally { if (active) setSearchingDiagnosis(false); }\n    }, 300);\n    return () => { active = false; clearTimeout(timer); };\n  }, [diagnosis, selectedDiagnosis]);\n  const [meds, setMeds] = useState<Medication[]>([blank()]);\n  const [acknowledged, setAcknowledged] = useState(false);\n  const diagnosisTitle = (selectedDiagnosis?.title ?? diagnosis).trim();\n  const profile = patientProfiles[a.patient];\n  const allergyVisible = !!profile && (profile.careTeamSharingConsent || profile.allergies.some((al) => al.recordedBy === a.doctorId));\n  const alerts = useMemo(() => {\n    const mine = prescriptions.filter((p) => appointments.some((x) => x.id === p.appointmentId && x.patient === a.patient));\n    return checkPrescription(meds, allergyVisible ? profile!.allergies : [], activeMedicines(mine, todayISO()));\n  }, [meds, prescriptions, appointments, profile, allergyVisible, a.patient]);\n  const severe = alerts.some((x) => x.level === \"severe\");\n  useEffect(() => { setAcknowledged(false); }, [alerts.map((x) => x.id).join(\"|\")]);\n  const upd = (i: number, p: Partial<Medication>) => setMeds((m) => m.map((x, j) => (j === i ? { ...x, ...p, ...(p.frequency ? { times: defaultTimes(p.frequency) } : {}) } : x)));\n  return (\n    <div className=\"pb-8\">\n      <Header title=\"Write prescription\" />\n      <div className=\"space-y-4 px-5\">\n        <Card className=\"flex items-center gap-3\"><Avatar doctor={{ name: a.patient }} size={44} /><div><p className=\"text-sm font-bold\">{a.patient}<\/p><p className=\"text-xs text-muted-foreground\">{a.reason}<\/p><\/div><\/Card>\n        <Field label=\"Diagnosis \u00b7 ICD-11 MMS\"><div className=\"relative\"><Search className=\"absolute left-4 top-4 h-4 w-4 text-muted-foreground\" /><input className={inputCls + \" pl-10\"} value={diagnosis} onChange={(e) => { setDiagnosis(e.target.value); setSelectedDiagnosis(null); setShowOptions(true); }} placeholder=\"Search ICD-11 diagnosis\" autoComplete=\"off\" /><\/div><\/Field>\n        {searchingDiagnosis && <p className=\"text-xs text-muted-foreground\">Searching ICD-11\u2026<\/p>}\n        {showOptions && !selectedDiagnosis && diagnosis.trim().length >= 2 && <div className=\"max-h-52 overflow-y-auto rounded-2xl border bg-card shadow-card\">\n          {diagnosisOptions.map((item) => <button type=\"button\" key={`${item.code}-${item.title}`} onClick={() => { setSelectedDiagnosis(item.code ? item : null); setDiagnosis(item.title); setDiagnosisOptions([]); setShowOptions(false); }} className=\"flex w-full items-start gap-3 border-b px-3 py-2.5 text-left\"><span className=\"min-w-12 rounded bg-primary-soft px-2 py-1 text-center text-[10px] font-bold text-primary\">{item.code || \"No code\"}<\/span><span className=\"text-xs font-medium\">{item.title}<\/span><\/button>)}\n          <button type=\"button\" onClick={() => { setShowOptions(false); setDiagnosisOptions([]); }} className=\"flex w-full items-start gap-3 px-3 py-2.5 text-left\"><span className=\"min-w-12 rounded bg-muted px-2 py-1 text-center text-[10px] font-bold\">Free text<\/span><span className=\"text-xs font-medium\">Use \u201c{diagnosis.trim()}\u201d as written<\/span><\/button>\n          {offlineList && <p className=\"border-t px-3 py-2 text-[10px] text-muted-foreground\">Showing the built-in list because live ICD-11 search is unavailable. Confirm codes against the WHO ICD-11 browser.<\/p>}\n        <\/div>}\n        {diagnosis.trim() && !selectedDiagnosis && !showOptions && <p className=\"text-[11px] text-muted-foreground\">Saved as written, without an ICD-11 code. Edit the text to see coded suggestions.<\/p>}\n        {selectedDiagnosis && <Card className=\"flex items-center gap-2 border border-primary/20 p-3\"><span className=\"rounded bg-primary-soft px-2 py-1 text-[10px] font-bold text-primary\">ICD-11 {selectedDiagnosis.code}<\/span><span className=\"text-xs font-semibold\">{selectedDiagnosis.title}<\/span><\/Card>}\n        <Field label=\"Doctor notes\"><textarea className={cn(inputCls, \"h-auto py-3\")} rows={4} value={clinicalNotes} onChange={(e) => setClinicalNotes(e.target.value)} placeholder=\"Clinical assessment, relevant history, and follow-up plan\" /><\/Field>\n        {meds.map((m, i) => (\n          <Card key={m.id} className=\"space-y-3\">\n            <div className=\"flex items-center justify-between\"><p className=\"text-xs font-bold text-primary\">Medication {i + 1}<\/p>{meds.length > 1 && <button onClick={() => setMeds(meds.filter((_, j) => j !== i))} aria-label=\"Remove\"><Trash2 className=\"h-4 w-4 text-destructive\" /><\/button>}<\/div>\n            <div className=\"relative\">\n              <input className={inputCls} placeholder=\"Drug name & strength (type freely or pick a suggestion)\" value={m.name} autoComplete=\"off\" onFocus={() => setMedFocus(i)} onBlur={() => setTimeout(() => setMedFocus((f) => (f === i ? null : f)), 150)} onChange={(e) => upd(i, { name: e.target.value })} />\n              {medFocus === i && m.name.trim().length >= 2 && (() => {\n                const q = m.name.trim().toLowerCase();\n                const hits = MEDICINES.filter((x) => x.toLowerCase().includes(q) && x.toLowerCase() !== q).slice(0, 6);\n                return hits.length > 0 && <div className=\"absolute z-10 mt-1 max-h-48 w-full overflow-y-auto rounded-2xl border bg-card shadow-card\">{hits.map((x) => <button type=\"button\" key={x} onMouseDown={(e) => { e.preventDefault(); upd(i, { name: x }); setMedFocus(null); }} className=\"block w-full border-b px-3 py-2.5 text-left text-xs font-medium last:border-0\">{x}<\/button>)}<\/div>;\n              })()}\n            <\/div>\n            <div className=\"grid grid-cols-3 gap-2\">\n              <input className={inputCls} placeholder=\"Dose\" value={m.dose} onChange={(e) => upd(i, { dose: e.target.value })} />\n              <select className={inputCls} value={m.frequency} onChange={(e) => upd(i, { frequency: +e.target.value })}>{[1, 2, 3, 4].map((n) => <option key={n} value={n}>{n}\u00d7/day<\/option>)}<\/select>\n              <input type=\"number\" className={inputCls} value={m.days} onChange={(e) => upd(i, { days: +e.target.value })} aria-label=\"Days\" />\n            <\/div>\n            <input className={inputCls} placeholder=\"Instructions (e.g. after meals)\" value={m.notes} onChange={(e) => upd(i, { notes: e.target.value })} />\n          <\/Card>\n        ))}\n        <Btn variant=\"soft\" className=\"w-full\" onClick={() => setMeds([...meds, blank()])}><Plus className=\"h-4 w-4\" />Add medication<\/Btn>\n        {!allergyVisible && <Card className=\"border border-amber-300 bg-amber-50 p-3 text-xs text-amber-900\">This patient has not shared allergy information with their care team. Ask about allergies before prescribing.<\/Card>}\n        {alerts.length > 0 && <div className=\"space-y-2\" role=\"alert\">\n          {alerts.map((x) => (\n            <Card key={x.id} className={cn(\"space-y-1 border p-3\", x.level === \"severe\" ? \"border-destructive bg-destructive/5\" : \"border-amber-300 bg-amber-50\")}>\n              <div className=\"flex items-center gap-2 text-sm font-bold\"><ShieldAlert className={cn(\"h-4 w-4\", x.level === \"severe\" ? \"text-destructive\" : \"text-amber-600\")} />{x.title}<span className=\"ml-auto rounded bg-card px-2 py-0.5 text-[10px] uppercase\">{x.level}<\/span><\/div>\n              <p className=\"text-xs text-muted-foreground\">{x.detail}<\/p>\n            <\/Card>\n          ))}\n          <p className=\"text-[10px] text-muted-foreground\">Automated checks use a small built-in reference list. They support, but do not replace, your clinical judgement or a full drug reference.<\/p>\n          {severe && <label className=\"flex items-start gap-2 text-xs font-semibold\"><input type=\"checkbox\" checked={acknowledged} onChange={(e) => setAcknowledged(e.target.checked)} className=\"mt-0.5\" />I have reviewed the severe alerts and still want to prescribe this combination.<\/label>}\n        <\/div>}\n        <Btn className=\"w-full\" disabled={!diagnosisTitle || meds.some((m) => !m.name.trim()) || (severe && !acknowledged)} onClick={() => {\n          set((s) => ({ prescriptions: [{ id: `p${Date.now()}`, doctorId: a.doctorId, appointmentId: a.id, date: todayISO(), diagnosis: diagnosisTitle, ...(selectedDiagnosis?.code ? { diagnosisCode: selectedDiagnosis.code } : {}), clinicalNotes, meds, safetyAlerts: alerts.map((x) => `${x.level}: ${x.title}`), safetyAcknowledged: severe && acknowledged }, ...s.prescriptions],\n            messages: fromChat ? [...s.messages, { id: `m${Date.now()}`, doctorId: a.doctorId, patient: a.patient, from: \"doctor\", text: `\ud83d\udc8a Prescription sent: ${diagnosisTitle}. ${meds.map((m) => `${m.name} (${m.dose}, ${m.frequency}\u00d7/day for ${m.days} days)`).join(\"; \")}. Find it under Meds to set dose reminders.`, at: new Date().toTimeString().slice(0, 5) }] : s.messages }));\n          toast.success(\"Prescription sent to patient\");\n          if (fromChat) back(); else go({ name: \"doc-home\" });\n        }}><FileText className=\"h-4 w-4\" />Save diagnosis & prescription<\/Btn>\n      <\/div>\n    <\/div>\n  );\n}\n\nexport function Call({ appointmentId }: { appointmentId: string }) {\n  const { appointments, doctors, role, set, go, vitals, prescriptions } = useTele();\n  const a = appointments.find((x) => x.id === appointmentId)!;\n  const d = doctors.find((x) => x.id === a.doctorId)!;\n  const other = role === \"doctor\" ? { name: a.patient } : d;\n  const patientHistory = appointments.filter((item) => item.patient === a.patient && item.id !== a.id);\n  const previousPrescription = prescriptions.find((rx) => patientHistory.some((item) => item.id === rx.appointmentId));\n  const [phase, setPhase] = useState<\"ringing\" | \"live\">(\"ringing\");\n  const [secs, setSecs] = useState(0);\n  const [mic, setMic] = useState(true);\n  const [cam, setCam] = useState(a.type === \"video\");\n  const [quickChat, setQuickChat] = useState(false);\n  useEffect(() => {\n    if (phase === \"ringing\") { const t = setTimeout(() => setPhase(\"live\"), 2500); return () => clearTimeout(t); }\n    const i = setInterval(() => setSecs((s) => s + 1), 1000);\n    return () => clearInterval(i);\n  }, [phase]);\n  const end = () => {\n    set((s) => ({ appointments: s.appointments.map((x) => (x.id === a.id ? { ...x, status: \"completed\" } : x)) }));\n    if (role === \"doctor\") go({ name: \"doc-prescribe\", appointmentId: a.id });\n    else go({ name: \"rate\", appointmentId: a.id });\n  };\n  const mm = `${String(Math.floor(secs / 60)).padStart(2, \"0\")}:${String(secs % 60).padStart(2, \"0\")}`;\n  const isVideo = a.type === \"video\" && phase === \"live\";\n  const quickSend = (text: string) => set((s) => ({ messages: [...s.messages, { id: `q${Date.now()}`, doctorId: a.doctorId, from: role === \"doctor\" ? \"doctor\" : \"patient\", text, at: new Date().toTimeString   doctors: DOCTORS,\n  myDoctorId: null,\n  appointments: [\n    { id: \"a1\", doctorId: \"d1\", patient: \"Joy Kamau\", date: todayISO(), time: \"16:00\", type: \"video\", reason: \"Persistent cough and mild fever\", status: \"upcoming\", paid: true },\n    { id: \"a0\", doctorId: \"d4\", patient: \"Joy Kamau\", date: todayISO(-6), time: \"11:30\", type: \"video\", reason: \"Skin rash on arms\", status: \"completed\", paid: true, rated: true },\n  ],\n  prescriptions: [\n    {\n      id: \"p0\", doctorId: \"d4\", appointmentId: \"a0\", date: todayISO(-6), diagnosis: \"Contact dermatitis\",\n      meds: [\n        { id: \"m1\", name: \"Hydrocortisone 1% cream\", dose: \"Thin layer\", frequency: 2, days: 10, notes: \"Apply to affected skin\", times: defaultTimes(2), reminders: true, taken: [] },\n        { id: \"m2\", name: \"Cetirizine 10mg\", dose: \"1 tablet\", frequency: 1, days: 7, notes: \"At night, may cause drowsiness\", times: [\"21:00\"], reminders: true, taken: [] },\n      ],\n    },\n  ],\n  patientProfiles: {\n    \"Joy Kamau\": {\n      patient: \"Joy Kamau\",\n      careTeamSharingConsent: true,\n      allergies: [{ id: \"allergy-joy-1\", name: \"Penicillin\", reaction: \"Hives\", severity: \"Severe\", date: todayISO(-20), recordedBy: \"d4\" }],\n    },\n  },\n  messages: [\n    { id: \"x1\", doctorId: \"d4\", from: \"doctor\", text: \"Hi Joy, how is the rash today?\", at: \"09:12\" },\n    { id: \"x2\", doctorId: \"d4\", from: \"patient\", text: \"Much better, the itching has reduced.\", at: \"09:20\" },\n    { id: \"x3\", doctorId: \"d1\", patient: \"Joy Kamau\", from: \"patient\", text: \"Good morning doctor. The cough is now on day three and I still get mild fevers at night.\", at: \"08:40\" },\n  ],\n  records: [{ id: \"r1\", name: \"Full blood count.pdf\", kind: \"Lab result\", size: \"240 KB\", date: todayISO(-20) }],\n  vitals: [], labOrders: [], walletBalance: 2500,\n  walletEntries: [{ id: \"w0\", label: \"Welcome credit\", amount: 2500, date: todayISO(), kind: \"credit\" }],\n  acceptingPatients: true,\n  availability: {},\n});\n\ntype Ctx = State & {\n  screen: Screen;\n  go: (s: Screen) => void;\n  back: () => void;\n  set: (fn: (s: State) => Partial<State>) => void;\n  reset: () => void;\n};\n\nconst TeleCtx = createContext<Ctx | null>(null);\nconst KEY = \"medilink-demo-v1\";\n\nexport function TeleProvider({ children }: { children: ReactNode }) {\n  const [state, setState] = useState<State>(seed);\n  const [stack, setStack] = useState<Screen[]>([{ name: \"welcome\" }]);\n  const [loaded, setLoaded] = useState(false);\n\n  useEffect(() => {\n    try {\n      const raw = localStorage.getItem(KEY);\n      if (raw) {\n        const s = JSON.parse(raw) as Partial<State>;\n        const defaults = seed();\n        const profiles = s.patientProfiles ?? defaults.patientProfiles;\n        setState({ ...defaults, ...s, patientProfiles: Object.fromEntries(Object.entries(profiles).map(([name, profile]) => [name, { ...profile, careTeamSharingConsent: profile.careTeamSharingConsent ?? defaults.patientProfiles[name]?.careTeamSharingConsent ?? false }])), vitals: s.vitals ?? [], labOrders: s.labOrders ?? [], walletBalance: s.walletBalance ?? 2500, walletEntries: s.walletEntries ?? defaults.walletEntries, availability: s.availability ?? {} });\n        if (s.role) setStack([{ name: s.role === \"doctor\" ? \"doc-home\" : \"home\" }]);\n      }\n    } catch {}\n    setLoaded(true);\n  }, []);\n  useEffect(() => {\n    if (loaded) localStorage.setItem(KEY, JSON.stringify(state));\n  }, [state, loaded]);\n\n  const value: Ctx = {\n    ...state,\n    screen: stack[stack.length - 1]!,\n    go: (s) => setStack((st) => ([\"home\", \"appointments\", \"meds\", \"chats\", \"profile\", \"doc-home\", \"doc-patients\", \"doc-chats\", \"doc-schedule\", \"doc-settings\", \"welcome\"].includes(s.name) ? [s] : [...st, s])),\n    back: () => setStack((st) => (st.length > 1 ? st.slice(0, -1) : st)),\n    set: (fn) => setState((s) => ({ ...s, ...fn(s) })),\n    reset: () => { localStorage.removeItem(KEY); setState(seed()); setStack([{ name: \"welcome\" }]); },\n  };\n  return <TeleCtx.Provider value={value}>{children}<\/TeleCtx.Provider>;\n}\n\nexport function useTele() {\n  const c = useContext(TeleCtx);\n  if (!c) throw new Error(\"useTele outside provider\");\n  return c;\n}\n", "src/lib/tele/data.ts": "import doc1 from \"@/assets/doc1.jpg\";\nimport doc2 from \"@/assets/doc2.jpg\";\nimport doc3 from \"@/assets/doc3.jpg\";\nimport doc4 from \"@/assets/doc4.jpg\";\n\nexport type Review = { author: string; rating: number; text: string };\nexport type Doctor = {\n  id: string;\n  name: string;\n  specialty: string;\n  photo?: string;\n  years: number;\n  fee: number;\n  rating: number;\n  bio: string;\n  license: string;\n  languages: string[];\n  reviews: Review[];\n};\nexport type CallType = \"video\" | \"voice\";\nexport type Appointment = {\n  id: string;\n  doctorId: string;\n  patient: string;\n  date: string; // YYYY-MM-DD\n  time: string; // HH:MM\n  type: CallType;\n  reason: string;\n  status: \"upcoming\" | \"completed\" | \"cancelled\";\n  paid: boolean;\n  rated?: boolean;\n};\nexport type Medication = {\n  id: string;\n  name: string;\n  status?: \"active\" | \"discontinued\";\n  dose: string;\n  frequency: number; // times per day\n  days: number;\n  notes: string;\n  times: string[];\n  reminders: boolean;\n  taken: string[]; // \"YYYY-MM-DD HH:MM\"\n};\nexport type Prescription = {\n  id: string;\n  doctorId: string;\n  appointmentId: string;\n  date: string;\n  diagnosis: string;\n  diagnosisCode?: string;\n  clinicalNotes?: string;\n  meds: Medication[];\n  safetyAlerts?: string[];\n  safetyAcknowledged?: boolean;\n};\nexport type Message = { id: string; doctorId: string; patient?: string; from: \"patient\" | \"doctor\"; text: string; at: string };\nexport type HealthRecord = { id: string; name: string; kind: string; size: string; date: string };\n\nexport const SPECIALTIES =
