g: 4, text: \"Great advice for my eczema.\" }],\n  },\n  {\n    id: \"d5\", name: \"Dr. Mercy Achieng\", specialty: \"Pediatrics\", years: 11, fee: 2000, rating: 4.8,\n    bio: \"Children's doctor \u2014 fevers, coughs, growth and vaccinations guidance.\",\n    license: \"KMPDC-K44871\", languages: [\"English\", \"Swahili\", \"Luo\"], reviews: [],\n  },\n  {\n    id: \"d6\", name: \"Dr. Lilian Mutua\", specialty: \"Gynecology\", years: 14, fee: 3000, rating: 4.9,\n    bio: \"Women's health, pregnancy check-ins, family planning and cycle concerns.\",\n    license: \"KMPDC-G21904\", languages: [\"English\", \"Swahili\"], reviews: [],\n  },\n];\n\nexport const TIME_SLOTS = [\"09:00\", \"10:00\", \"11:30\", \"13:00\", \"14:30\", \"16:00\", \"17:30\", \"19:00\"];\n\nexport function todayISO(offset = 0) {\n  const d = new Date();\n  d.setDate(d.getDate() + offset);\n  return d.toISOString().slice(0, 10);\n}\n\nexport function defaultTimes(freq: number) {\n  return (({ 1: [\"08:00\"], 2: [\"08:00\", \"20:00\"], 3: [\"08:00\", \"14:00\", \"20:00\"], 4: [\"07:00\", \"12:00\", \"17:00\", \"22:00\"] }) as Record<number, string[]>)[freq] ?? [\"08:00\"];\n}\n\nexport function initials(name: string) {\n  return name.replace(\"Dr. \", \"\").split(\" \").map((p) => p[0]).slice(0, 2).join(\"\");\n}\n\nexport function formatKES(n: number) {\n  return `KES ${n.toLocaleString()}`;\n}\n", "src/lib/tele/safety.ts": "import type { Medication, Prescription } from \"./data\";\nimport type { PatientAllergy } from \"./store\";\n\nexport type SafetyAlert = { id: string; level: \"severe\" | \"moderate\" | \"info\"; kind: \"allergy\" | \"interaction\" | \"duplicate\"; title: string; detail: string };\n\n/** Drug groups used for allergy, interaction and duplicate-therapy checks. Names are matched as lowercase substrings. */\nconst GROUPS: Record<string, { label: string; names: string[] }> = {\n  penicillin: { label: \"penicillins\", names: [\"penicillin\", \"amoxicillin\", \"ampicillin\", \"flucloxacillin\", \"cloxacillin\", \"piperacillin\", \"co-amoxiclav\", \"augmentin\", \"amoxyclav\"] },\n  cephalosporin: { label: \"cephalosporins\", names: [\"cef\", \"ceph\", \"cipro-ceph\"] },\n  sulfa: { label: \"sulfonamides (sulfa drugs)\", names: [\"sulfa\", \"sulpha\", \"cotrimoxazole\", \"co-trimoxazole\", \"septrin\", \"bactrim\", \"sulfamethoxazole\"] },\n  nsaid: { label: \"NSAIDs\", names: [\"ibuprofen\", \"diclofenac\", \"naproxen\", \"aspirin\", \"ketoprofen\", \"indomethacin\", \"piroxicam\", \"meloxicam\", \"celecoxib\", \"ketorolac\", \"brufen\", \"voltaren\"] },\n  opioid: { label: \"opioids\", names: [\"codeine\", \"tramadol\", \"morphine\", \"pethidine\", \"oxycodone\"] },\n  macrolide: { label: \"macrolides\", names: [\"erythromycin\", \"azithromycin\", \"clarithromycin\"] },\n  quinolone: { label: \"fluoroquinolones\", names: [\"ciprofloxacin\", \"levofloxacin\", \"ofloxacin\", \"norfloxacin\"] },\n  acei: { label: \"ACE inhibitors\", names: [\"enalapril\", \"lisinopril\", \"captopril\", \"ramipril\", \"perindopril\"] },\n  arb: { label: \"ARBs\", names: [\"losartan\", \"valsartan\", \"telmisartan\", \"candesartan\", \"irbesartan\"] },\n  ssri: { label: \"SSRIs\", names: [\"fluoxetine\", \"sertraline\", \"citalopram\", \"escitalopram\", \"paroxetine\"] },\n  nitrate: { label: \"nitrates\", names: [\"isosorbide\", \"glyceryl trinitrate\", \"nitroglycerin\", \"gtn\"] },\n  pde5: { label: \"PDE-5 inhibitors\", names: [\"sildenafil\", \"tadalafil\", \"vardenafil\"] },\n  anticoag: { label: \"warfarin\", names: [\"warfarin\"] },\n  statin: { label: \"statins\", names: [\"simvastatin\", \"atorvastatin\", \"lovastatin\"] },\n  potassium: { label: \"potassium-raising agents\", names: [\"potassium chloride\", \"spironolactone\", \"amiloride\", \"eplerenone\"] },\n  methotrexate: { label: \"methotrexate\", names: [\"methotrexate\"] },\n  paracetamol: { label: \"paracetamol\", names: [\"paracetamol\", \"acetaminophen\", \"panadol\"] },\n};\ntype Pair = [string, string, SafetyAlert[\"level\"], string];\nconst PAIRS: Pair[] = [\n  [\"anticoag\", \"nsaid\", \"severe\", \"Warfarin with an NSAID raises bleeding risk substantially.\"],\n  [\"anticoag\", \"macrolide\", \"moderate\", \"Macrolides can increase warfarin effect; monitor INR.\"],\n  [\"anticoag\", \"quinolone\", \"moderate\", \"Fluoroquinolones can increase warfarin effect; monitor INR.\"],\n  [\"anticoag\", \"sulfa\", \"severe\", \"Co-trimoxazole strongly increases warfarin effect and bleeding risk.\"],\n  [\"pde5\", \"nitrate\", \"severe\", \"PDE-5 inhibitors with nitrates can cause dangerous hypotension. Avoid.\"],\n  [\"methotrexate\", \"sulfa\", \"severe\", \"Co-trimoxazole with methotrexate can cause severe bone-marrow toxicity.\"],\n  [\"methotrexate\", \"nsaid\", \"moderate\", \"NSAIDs can reduce methotrexate clearance and increase toxicity.\"],\n  [\"acei\", \"potassium\", \"severe\", \"ACE inhibitor with potassium-raising agents risks hyperkalaemia.\"],\n  [\"arb\", \"potassium\", \"severe\", \"ARB with potassium-raising agents risks hyperkalaemia.\"],\n  [\"acei\", \"nsaid\", \"moderate\", \"NSAIDs can blunt ACE inhibitors and harm kidney function.\"],\n  [\"arb\", \"nsaid\", \"moderate\", \"NSAIDs can blunt ARBs and harm kidney function.\"],\n  [\"statin\", \"macrolide\", \"moderate\", \"Clarithromycin or erythromycin with simvastatin or atorvastatin raises myopathy risk.\"],\n  [\"ssri\", \"opioid\", \"moderate\", \"Tramadol with SSRIs can cause serotonin syndrome and lowers seizure threshold.\"],\n  [\"ssri\", \"nsaid\", \"moderate\", \"SSRIs with NSAIDs increase gastrointestinal bleeding risk.\"],\n];\nconst norm = (s: string) => s.toLowerCase().replace(/\\s+/g, \" \").trim();\nconst groupsOf = (name: string) => Object.entries(GROUPS).filter(([, g]) => g.names.some((n) => norm(name).includes(n))).map(([k]) => k);\n\n/** Medicines from earlier prescriptions that are still within their course and not discontinued. */\nexport function activeMedicines(prescriptions: Prescription[], today: string): Medication[] {\n  return prescriptions.flatMap((p) => p.meds.filter((m) => {\n    if (m.status === \"discontinued\") return false;\n    const end = new Date(p.date); end.setDate(end.getDate() + m.days);\n    return end.toISOString().slice(0, 10) >= today;\n  }));\n}\n\nexport function checkPrescription(newMeds: Pick<Medication, \"name\">[], allergies: PatientAllergy[], current: Pick<Medication, \"name\">[] = []): SafetyAlert[] {\n  const alerts: SafetyAlert[] = [];\n  const names = newMeds.map((m) => m.name.trim()).filter(Boolean);\n  names.forEach((name, i) => {\n    const gs = groupsOf(name);\n    allergies.forEach((al) => {\n      const a = norm(al.name);\n      const direct = norm(name).includes(a) || a.includes(norm(name));\n      const allergyGroups = Object.entries(GROUPS).filter(([, g]) => g.names.some((n) => a.includes(n) || n.includes(a))).map(([k]) => k);\n      const sameClass = allergyGroups.some((k) => gs.includes(k));\n      const cross = (allergyGroups.includes(\"penicillin\") && gs.includes(\"cephalosporin\")) || (allergyGroups.includes(\"cephalosporin\") && gs.includes(\"penicillin\"));\n      if (direct || sameClass) alerts.push({ id: `al-${i}-${al.id}`, level: al.severity === \"Mild\" ? \"moderate\" : \"severe\", kind: \"allergy\", title: `Allergy: ${name}`, detail: `Patient has a recorded ${al.severity.toLowerCase()} allergy to ${al.name}${al.reaction ? ` (${al.reaction})` : \"\"}.` });\n      else if (cross) alerts.push({ id: `ax-${i}-${al.id}`, level: \"moderate\", kind: \"allergy\", title: `Possible cross-reactivity: ${name}`, detail: `Recorded allergy to ${al.name}. Penicillins and cephalosporins can cross-react (low but real risk).` });\n    });\n  });\n  const all = [...names.map((n) => ({ n, src: \"new\" as const })), ...current.map((m) => ({ n: m.name, src: \"current\" as const }))].filter((x) => x.n.trim());\n  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {\n    const a = all[i]!, b = all[j]!;\n    if (a.src === \"current\" && b.src === \"current\") continue;\n    const ga = groupsOf(a.n), gb = groupsOf(b.n);\n    const where = a.src === \"current\" || b.src === \"current\" ? \" (one is already in the patient's active medicines)\" : \"\";\n    if (norm(a.n) === norm(b.n)) { alerts.push({ id: `du-${i}-${j}`, level: \"moderate\", kind: \"duplicate\", title: `Duplicate: ${a.n}`, detail: `The same medicine appears twice${where}.` }); continue; }\n    for (const [x, y, level, text] of PAIRS) if ((ga.includes(x) && gb.includes(y)) || (ga.includes(y) && gb.includes(x))) alerts.push({ id: `in-${i}-${j}-${x}-${y}`, level, kind: \"interaction\", title: `${a.n} + ${b.n}`, detail: `${text}${where}` });\n    const shared = ga.filter((g) => gb.includes(g) && [\"nsaid\", \"ssri\", \"opioid\", \"paracetamol\", \"acei\", \"arb\", \"statin\"].includes(g));\n    shared.forEach((g) => alerts.push({ id: `dt-${i}-${j}-${g}`, level: \"moderate\", kind: \"duplicate\", title: `Duplicate therapy: ${a.n} + ${b.n}`, detail: `Two ${GROUPS[g]!.label} together${where}. Check this is intended.` }));\n  }\n  const rank = { severe: 0, moderate: 1, info: 2 };\n  return alerts.sort((x, y) => rank[x.level] - rank[y.level]);\n}\n", "src/lib/utils.ts": "import { clsx, type ClassValue } from \"clsx\";\nimport { twMerge } from \"tailwind-merge\";\n\nexport function cn(...inputs: ClassValue[]) {\n  return twMerge(clsx(inputs));\n}\n", "src/routes/index.tsx": "import { createFileRoute } from \"@tanstack/react-router\";\nimport { HeartPulse } from \"lucide-react\";\nimport { PhoneApp } from \"@/components/tele/PhoneApp\";\n\nexport const Route = createFileRoute(\"/\")({\n  head: () => ({\n    meta: [\n      { title: \"MediLink \u2014 Telemedicine: book doctors, video calls & prescriptions\" },\n      { name: \"description\", content: \"Book certified doctors, consult by video or voice, receive prescriptions and set medication reminders.\" },\n      { property: \"og:title\", content: \"MediLink \u2014 Telemedicine app\" },\n      { property: \"og:description\", content: \"Book certified doctors, consult by video or voice and never miss a dose.\" },\n      { property: \"og:type\", content: \"website\" },\n      { name: \"twitter:card\", content: \"summary_large_image\" },\n    ],\n  }),\n  component: Index,\n});\n\nfunction Index() {\n  return (\n    <main className=\"flex min-h-screen items-center justify-center gap-16 px-4 py-4\">\n      <div className=\"hidden max-w-sm lg:block\">\n        <div className=\"flex items-center gap-2 text-primary\"><HeartPulse className=\"h-6 w-6\" /><span className=\"font-display text-lg font-bold\">MediLink<\/span><\/div>\n        <h1 className=\"mt-6 text-5xl font-extrabold leading-tight\">A doctor in your pocket.<\/h1>\n        <p className=\"mt-4 text-muted-foreground\">Find certified doctors, book a slot, pay with M-Pesa, take the video or voice call, then get prescriptions with smart dose reminders.<\/p>\n        <ul className=\"mt-6 space-y-2 text-sm text-muted-foreground\">\n          <li>\u2022 Try as a patient: book, join call, rate, see meds<\/li>\n          <li>\u2022 Try as a doctor: list yourself, call, prescribe<\/li>\n        <\/ul>\n      <\/div>\n      <PhoneApp />\n    <\/main>\n  );\n}\n"}</script>
